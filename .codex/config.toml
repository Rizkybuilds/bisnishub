# BisnisHub governed Codex project configuration.
#
# This project-level config is an execution adapter.
# It is NOT a source of engineering or business authority.
#
# Important:
# The Engineering Gateway must not prevent Codex itself from starting.
# Gateway authorization is enforced when gateway tools are called.

approval_policy = "on-request"
approvals_reviewer = "user"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false

[mcp_servers.bisnishubEngineeringGateway]
command = "python"
args = ["tools/engineering_gateway/server.py"]

# Forward the trusted launcher session only when the parent process has one.
env_vars = ["BISNISHUB_ENGINEERING_GATEWAY_SESSION"]

enabled = true

# IMPORTANT:
# The MCP process may be unavailable on hosts that have not activated the
# local engineering gateway runtime yet. This must not prevent Codex thread
# creation. Governed actions still fail closed when their gateway is absent.
required = false

startup_timeout_sec = 20
tool_timeout_sec = 1800

enabled_tools = [
  "list_engineering_profiles",
  "preflight_engineering_profile",
  "execute_engineering_profile",
]

# Keep an additional host-side approval boundary.
default_tools_approval_mode = "prompt"
schema_version: 1

registry:
  id: bisnishub.engineering.expertise
  status: ACTIVE
  version: "1.0"
  owner: Rizky
  scope: repository-engineering
  semantic_policy: docs/engineering/engineering-ai-control-plane.md
  guide: .agents/expertise/README.md
  role_registry: .agents/roles/contracts.json
  risk_policy: docs/governance/cross-system-risk-classification.md

principles:
  selection_mode: on-demand
  prefer_minimum_sufficient_set: true
  expertise_grants_role: false
  expertise_grants_permission: false
  expertise_grants_tool_access: false
  expertise_grants_approval: false
  expertise_grants_autonomy: false
  provider_neutral: true

allowed_maturity:
  - ACTIVE
  - PROVISIONAL
  - DEFERRED

allowed_groups:
  - core
  - founder-control
  - automation
  - ai
  - platform

expertise:
  - id: EXP-001
    slug: system-business-architecture
    name: System & Business Architecture
    maturity: ACTIVE
    group: core
    mission: >
      Preserve system boundaries, semantic ownership, canonical authority,
      architectural coherence, and business-to-system separation across BisnisHub.
    primary_roles:
      - planner
      - auditor
    secondary_roles:
      - engineer
      - release-operator
    activation_signals:
      - cross-system architecture
      - semantic ownership
      - canonical source conflict
      - system boundary
      - architectural decision
      - repository-wide design
    canonical_sources:
      - docs/architecture/master-system-blueprint.md
      - docs/architecture/system-boundaries.md
      - docs/architecture/architectural-laws.md
      - docs/governance/canonical-source-map.md
      - docs/governance/documentation-constitution.md
    non_responsibilities:
      - Does not grant implementation permission.
      - Does not override system-owned business semantics.
      - Does not treat future architecture as implemented reality.

  - id: EXP-002
    slug: mgbos-domain-erp
    name: MGBOS Domain / ERP
    maturity: ACTIVE
    group: core
    mission: >
      Preserve MGBOS domain ownership, entity semantics, business state machines,
      business invariants, and operational transaction lineage.
    primary_roles:
      - planner
      - engineer
      - auditor
    secondary_roles:
      - qa
    activation_signals:
      - MGBOS entity
      - business state
      - order lifecycle
      - invoice
      - payment
      - production
      - inventory
      - procurement
      - shipment
      - QC
    canonical_sources:
      - systems/mgbos/docs/architecture/domain-map-capability-ownership.md
      - systems/mgbos/docs/architecture/canonical-data-model.md
      - systems/mgbos/docs/architecture/business-state-machines.md
      - systems/mgbos/docs/architecture/business-invariants.md
    non_responsibilities:
      - Does not redefine TeeStock business strategy.
      - Does not grant business mutation authority.
      - Does not collapse independent domain lifecycles into one generic status.

  - id: EXP-003
    slug: backend-command-engineering
    name: Backend & Command Engineering
    maturity: ACTIVE
    group: core
    mission: >
      Design and implement authenticated, authorized, validated, idempotent,
      transactional server command boundaries and backend application behavior.
    primary_roles:
      - engineer
      - auditor
    secondary_roles:
      - planner
      - qa
    activation_signals:
      - server command
      - RPC
      - API
      - server action
      - mutation
      - idempotency
      - transaction boundary
      - backend integration
    canonical_sources:
      - systems/mgbos/docs/architecture/command-event-model.md
      - systems/mgbos/docs/architecture/permission-authorization-model.md
      - systems/mgbos/docs/architecture/business-invariants.md
      - systems/mgbos/AGENTS.md
    non_responsibilities:
      - Does not bypass authorization for implementation convenience.
      - Does not invent a generic command bus when actual MGBOS contracts differ.
      - Does not treat frontend validation as server authorization.

  - id: EXP-004
    slug: postgresql-supabase-transaction
    name: PostgreSQL / Supabase Transaction
    maturity: ACTIVE
    group: core
    mission: >
      Preserve database transactional correctness, constraints, locking,
      migrations, RLS, grants, idempotency, concurrency, and recoverability.
    primary_roles:
      - engineer
      - auditor
      - qa
    secondary_roles:
      - planner
      - release-operator
    activation_signals:
      - PostgreSQL
      - Supabase
      - SQL
      - migration
      - RLS
      - transaction
      - row lock
      - advisory lock
      - constraint
      - database function
      - concurrency
    canonical_sources:
      - systems/mgbos/docs/adr/002-postgresql-system-of-record.md
      - systems/mgbos/docs/adr/003-supabase.md
      - systems/mgbos/docs/architecture/command-event-model.md
      - systems/mgbos/docs/runbooks/local-database.md
      - systems/mgbos/docs/engineering/agent-system/risk-classification.md
    non_responsibilities:
      - Does not authorize remote or production database mutation.
      - Does not permit modification of existing base migration history.
      - Does not turn database credentials into business permission.

  - id: EXP-005
    slug: authorization-iam-capability
    name: Authorization / IAM / Capability
    maturity: ACTIVE
    group: core
    mission: >
      Preserve identity, organization scope, role resolution, capability checks,
      least privilege, server-side authorization, and cross-tenant isolation.
    primary_roles:
      - planner
      - engineer
      - auditor
    secondary_roles:
      - qa
      - release-operator
    activation_signals:
      - authentication
      - authorization
      - role
      - permission
      - organization
      - capability
      - service principal
      - RLS
      - cross-org
      - privileged function
    canonical_sources:
      - systems/mgbos/docs/architecture/permission-authorization-model.md
      - docs/architecture/architectural-laws.md
      - docs/governance/cross-system-risk-classification.md
    non_responsibilities:
      - Does not grant roles or permissions by prompt.
      - Does not treat service credentials as authorization.
      - Does not treat hidden UI elements as access control.

  - id: EXP-006
    slug: financial-integrity
    name: Financial Integrity
    maturity: ACTIVE
    group: core
    mission: >
      Preserve authoritative financial truth, integer-money semantics,
      payment and invoice reconciliation, historical integrity, idempotency,
      concurrency safety, and economically correct transaction effects.
    primary_roles:
      - auditor
      - engineer
      - planner
    secondary_roles:
      - qa
      - release-operator
    activation_signals:
      - payment
      - invoice
      - payment allocation
      - refund
      - reversal
      - vendor bill
      - vendor payment
      - financial ledger
      - cost
      - margin
      - money
    canonical_sources:
      - systems/mgbos/docs/architecture/business-invariants.md
      - systems/mgbos/docs/architecture/canonical-data-model.md
      - systems/mgbos/docs/architecture/command-event-model.md
      - systems/mgbos/docs/engineering/agent-system/risk-classification.md
    non_responsibilities:
      - Does not approve or execute real payments.
      - Does not establish accounting policy outside canonical business/system authority.
      - Does not permit floating-point authoritative money.

  - id: EXP-007
    slug: security-trust-boundary
    name: Security & Trust Boundary
    maturity: ACTIVE
    group: core
    mission: >
      Preserve least authority, secret isolation, trusted execution boundaries,

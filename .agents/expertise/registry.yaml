      - systems/mgbos/docs/architecture/permission-authorization-model.md
      - systems/jarvis/docs/architecture/security-secrets-environment.md
      - docs/governance/cross-system-risk-classification.md
    non_responsibilities:
      - Does not grant privileged access.
      - Does not request raw secrets for documentation or review.
      - Does not assume AI instructions can replace technical security controls.


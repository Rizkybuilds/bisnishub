name: TeeStock F03 Admin Format Export Temporary
on:
  push:
    branches: [feat/teestock-cart-guest-checkout-f03]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: systems/mgbos
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: systems/mgbos/.node-version
      - run: pnpm install --frozen-lockfile
      - name: Format ERP order list and export the exact result
        run: |
          pnpm exec prettier --write 'apps/mgbos/src/app/(app)/orders/page.tsx'
          node -e "const fs=require('node:fs');process.stdout.write('FORMAT_ERP:'+fs.readFileSync('apps/mgbos/src/app/(app)/orders/page.tsx').toString('base64')+'\\n')"

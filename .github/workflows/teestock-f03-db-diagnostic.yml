name: TeeStock F03 Supabase Diagnostic Temporary
on:
  push:
    branches: [feat/teestock-cart-guest-checkout-f03]
permissions:
  contents: read
jobs:
  disposable-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: systems/mgbos
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: systems/mgbos/.node-version
          cache: pnpm
          cache-dependency-path: systems/mgbos/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Safe Docker environment diagnostics
        shell: bash
        run: |
          docker info --format 'Docker server: {{.ServerVersion}}; CPU: {{.NCPU}}; memory bytes: {{.MemTotal}}'
          df -h / | tail -1
      - name: Diagnose reduced stack with credential-safe failure categories
        shell: bash
        run: |
          set +e
          node_modules/.bin/supabase start --exclude studio,postgres-meta,edge-runtime,logflare,vector,realtime,supavisor,imgproxy --workdir . >/tmp/ts-f03-light.log 2>&1
          result=$?
          if [ "$result" -eq 0 ]; then
            echo "REDUCED_SUPABASE_STACK=STARTED"
            exit 0
          fi
          node - <<'NODE'
          const fs=require('node:fs');
          const s=fs.readFileSync('/tmp/ts-f03-light.log','utf8');
          const failureKinds={
            timeout:/context deadline exceeded|i\/o timeout|TLS handshake timeout|timeout awaiting response|timed out/i,
            dns:/no such host|lookup .*server misbehaving|failed to resolve|temporary failure in name resolution/i,
            http429:/429|too many requests|rate limit exceeded/i,
            http403:/403|forbidden|denied|unauthorized|authentication required/i,
            http502:/502|bad gateway|503|service unavailable/i,
            registryDockerHub:/registry-1\.docker\.io|auth\.docker\.io/i,
            registryGHCR:/ghcr\.io/i,
            registrySupabase:/supabase\.com|public\.ecr\.aws/i,
            proxy:/proxyconnect|proxy server|HTTPS_PROXY/i,
            connectionReset:/connection reset by peer|EOF|connection refused|network is unreachable/i,
            disk:/no space left on device|disk quota exceeded/i,
            ram:/out of memory|oom-killed|cannot allocate memory/i,
            containerHealth:/unhealthy|health check failed|container exited/i,
            imageManifest:/manifest unknown|no matching manifest|failed to pull image|pull access denied/i,
            dockerDaemon:/cannot connect to the Docker daemon|docker daemon is not running/i,
            permissions:/permission denied|operation not permitted/i,
            rpcError:/error|failed/i
          };
          for(const [kind,re] of Object.entries(failureKinds)){
            console.log('SUPABASE_ERROR_CLASS_'+kind+'='+re.test(s));
          }
          console.log('SUPABASE_LOG_LENGTH='+s.length);
          NODE
          echo "CONTAINERS_AFTER_START:"
          docker ps -a --format '{{.Names}}:{{.Status}}' | sed -n '1,14p'
          exit 1
      - name: Apply migrations and run full database test suite
        shell: bash
        run: |
          pnpm db:reset >/tmp/ts-f03-reset.log 2>&1 || {
            echo "::error::Local DB reset failed; output remains suppressed"
            exit 1
          }
          pnpm db:test
      - name: Stop disposable database
        if: always()
        run: pnpm db:stop >/dev/null 2>&1 || true

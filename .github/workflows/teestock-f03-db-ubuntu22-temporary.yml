name: TeeStock F03 Disposable Database Ubuntu 22 Test
on:
  push:
    branches: [feat/teestock-cart-guest-checkout-f03]
permissions:
  contents: read
jobs:
  db-legacy-runner:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: systems/mgbos
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: systems/mgbos/.node-version
          cache: pnpm
          cache-dependency-path: systems/mgbos/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify migration lint
        run: pnpm lint:sql
      - name: Start disposable Supabase (suppress local credentials)
        run: |
          if ! pnpm db:start >/dev/null 2>&1; then
            echo "::error::Supabase image/stack startup failed on Ubuntu 22"
            exit 1
          fi
      - name: Apply all local migrations
        run: |
          if ! pnpm db:reset >/dev/null 2>&1; then
            echo "::error::Local migration reset failed; inspect safe diagnostics separately"
            exit 1
          fi
      - name: Run full pgTAP suite
        run: pnpm db:test
      - name: Stop database
        if: always()
        run: pnpm db:stop >/dev/null 2>&1 || true

name: TeeStock F03 Baseline Main DB Startup Temporary
on:
  push:
    branches: [feat/teestock-cart-guest-checkout-f03]
permissions:
  contents: read
jobs:
  baseline-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: systems/mgbos
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: systems/mgbos/.node-version
          cache: pnpm
          cache-dependency-path: systems/mgbos/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Start baseline main disposable Supabase
        run: |
          if ! pnpm db:start >/dev/null 2>&1; then
            echo "::error::Baseline main also failed local Supabase startup"
            exit 1
          fi
      - name: Apply baseline migrations and tests
        run: |
          if ! pnpm db:reset >/dev/null 2>&1; then
            echo "::error::Baseline main DB reset failed"
            exit 1
          fi
          pnpm db:test
      - name: Stop local database
        if: always()
        run: pnpm db:stop >/dev/null 2>&1 || true

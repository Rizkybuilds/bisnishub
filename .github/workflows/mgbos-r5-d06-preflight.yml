name: MGBOS R5 D06 Catalog Preflight

on:
  workflow_dispatch:
    inputs:
      approved_commit_sha:
        description: 'Exact 40-character Owner-approved commit SHA to verify'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mgbos-r5-d06-preflight-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: systems/mgbos

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  catalog-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate authorization inputs and repository provenance
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_INPUT="${{ inputs.approved_commit_sha }}"
          
          # 1. Enforce exact 40-character lowercase hexadecimal SHA format
          if [[ ! "$COMMIT_INPUT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid approved_commit_sha. Expected exact 40 lowercase hex characters, got: '$COMMIT_INPUT'"
            exit 1
          fi

          # 2. Enforce repository provenance
          if [ "${{ github.repository }}" != "Rizkybuilds/bisnishub" ]; then
            echo "::error::Unauthorized repository provenance: '${{ github.repository }}'"
            exit 1
          fi

          # 3. Enforce ref boundary (main only)
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Preflight verification is only authorized on refs/heads/main. Current ref: '${{ github.ref }}'"
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.approved_commit_sha }}
          persist-credentials: false

      - name: Assert exact checked-out commit revision
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_HEAD=$(git rev-parse HEAD)
          EXPECTED_SHA="${{ inputs.approved_commit_sha }}"
          if [ "$ACTUAL_HEAD" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked-out HEAD ($ACTUAL_HEAD) does not match authorized commit SHA ($EXPECTED_SHA)"
            exit 1
          fi

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.34.5

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: systems/mgbos/.node-version
          cache: pnpm
          cache-dependency-path: systems/mgbos/pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Pre-execution static SQL asset integrity check
        run: |
          node scripts/r5-catalog-preflight-runner.mjs --verify-only --approved-commit-sha "${{ inputs.approved_commit_sha }}"

      - name: Start disposable database without disclosing local credentials
        run: |
          if ! pnpm db:start > /dev/null 2>&1; then
            echo "::error::Disposable database start failed (sensitive output suppressed)"
            exit 1
          fi

      - name: Reset disposable database to fresh migration and synthetic seed baseline
        run: |
          if ! pnpm db:reset > /dev/null 2>&1; then
            echo "::error::Disposable database reset failed (sensitive output suppressed)"
            exit 1
          fi

      - name: Execute R5 D06 catalog preflight runner
        run: |
          MGBOS_PREFLIGHT_APPROVED_COMMIT_SHA="${{ inputs.approved_commit_sha }}" \
          node scripts/r5-catalog-preflight-runner.mjs

      - name: Upload sanitized catalog evidence artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mgbos-r5-d06-preflight-evidence
          path: systems/mgbos/.qa-evidence/r5-preflight/
          retention-days: 30

      - name: Stop disposable local Supabase
        if: always()
        run: |
          if ! pnpm db:stop > /dev/null 2>&1; then
            echo "::error::Disposable Supabase teardown failed (sensitive output suppressed)"
            exit 1
          fi

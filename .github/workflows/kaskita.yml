name: KasKita
on:
  pull_request:
    branches: [main]
    paths:
      - 'systems/kaskita/**'
      - '.github/workflows/kaskita.yml'
  push:
    branches: [main]
    paths:
      - 'systems/kaskita/**'
      - '.github/workflows/kaskita.yml'
permissions:
  contents: read
jobs:
  kaskita-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: systems/kaskita/apps/mobile
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: systems/kaskita/apps/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install tsc --noEmit
      - run: npx --no-install expo export --platform android --output-dir .expo/ci-android

name: MGBOS Foundation
on:
  pull_request:
    branches: [main, feat/mgbos-uxr01-ui-foundation, security/mgbos-sec02-order-replay-isolation]
  push:
    branches: [main, qa/mgbos-uxr01-multirole-browser-acceptance, qa/mgbos-sec02-r4-live-assurance]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mgbos-foundation-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: systems/mgbos
env:
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: systems/mgbos/.node-version
          cache: pnpm
          cache-dependency-path: systems/mgbos/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Production HTTP smoke tests
        shell: bash
        run: |
          pnpm --filter @mgbos/app start > /tmp/mgbos.log 2>&1 &
          mgbos_pid=$!
          pnpm --filter @mgbos/teestock start > /tmp/teestock.log 2>&1 &
          teestock_pid=$!
          trap 'kill "$mgbos_pid" "$teestock_pid" 2>/dev/null || true' EXIT
          for port in 3101 3102; do
            ready=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent "http://127.0.0.1:$port/health" > /dev/null; then
                ready=true
                break
              fi
              sleep 1
            done
            if [ "$ready" != true ]; then
              cat /tmp/mgbos.log /tmp/teestock.log
              exit 1
            fi
          done
          pnpm test:integration
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: systems/mgbos/.node-version
          cache: pnpm
          cache-dependency-path: systems/mgbos/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node scripts/lint-migrations.mjs
      - name: Start disposable database without disclosing local credentials
        run: |
          if ! pnpm db:start > /dev/null 2>&1; then
            echo "::error::Disposable database start failed (sensitive output suppressed)"
            exit 1
          fi
      - name: Reset disposable database without disclosing local credentials
        run: |
          if ! pnpm db:reset > /dev/null 2>&1; then
            echo "::error::Disposable database reset failed (sensitive output suppressed)"
            exit 1
          fi
      - run: pnpm db:test
      - name: Generate database types reproducibly
        run: |
          pnpm db:types
          cp packages/database/generated/database.types.ts /tmp/database.types.ts
          pnpm db:types
          cmp /tmp/database.types.ts packages/database/generated/database.types.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mgbos-database-types
          path: systems/mgbos/packages/database/generated/database.types.ts
      - name: Verify runner and disposable database provenance (R4 QA)
        if: github.ref == 'refs/heads/qa/mgbos-sec02-r4-live-assurance' || github.base_ref == 'security/mgbos-sec02-order-replay-isolation'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qa-evidence/r4-live-assurance

          # 1. Verify GitHub-hosted runner identity
          if [ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]; then
            echo "::error::Execution rejected: runner must be an official github-hosted environment (found: '${RUNNER_ENVIRONMENT:-unknown}')"
            exit 1
          fi

          if [ "$RUNNER_OS" != "Linux" ]; then
            echo "::error::Execution rejected: runner OS must be Linux (found: '$RUNNER_OS')"
            exit 1
          fi

          if [ "$GITHUB_REPOSITORY" != "Rizkybuilds/bisnishub" ]; then
            echo "::error::Execution rejected: repository mismatch (found: '$GITHUB_REPOSITORY')"
            exit 1
          fi

          # 2. Verify git checkout ancestry against expected PR #70 HEAD
          EXPECTED_PR70_HEAD="dfc752b528a5dc580cfe9cf97b9170790f27618d"

          if ! git merge-base --is-ancestor "$EXPECTED_PR70_HEAD" HEAD; then
            echo "::error::Execution rejected: current commit does not descend from expected PR #70 HEAD ($EXPECTED_PR70_HEAD)"
            exit 1
          fi

          # 3. Verify that the ONLY diff between PR #70 HEAD and current HEAD is .github/workflows/mgbos-foundation.yml
          changed_files=$(git diff --name-only "$EXPECTED_PR70_HEAD" HEAD)
          if [ "$changed_files" != ".github/workflows/mgbos-foundation.yml" ]; then
            echo "::error::Execution rejected: unexpected files changed between PR #70 and QA branch: $changed_files"
            exit 1
          fi

          # 4. Verify working tree is clean
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Execution rejected: working tree contains uncommitted changes"
            exit 1
          fi

          # 5. Reset database to guaranteed clean seed state
          if ! pnpm db:reset > /dev/null 2>&1; then
            echo "::error::Disposable database reset failed (sensitive output suppressed)"
            exit 1
          fi

          # 6. Verify canonical local origin and zero existing transactional data
          CANONICAL_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"

          if ! curl --silent --fail -H "apikey: $CANONICAL_KEY" --output /dev/null "http://127.0.0.1:55431/rest/v1/"; then
            echo "::error::Connectivity to canonical local Supabase origin (http://127.0.0.1:55431) failed"
            exit 1
          fi

          orgs_json=$(curl --silent --fail -H "apikey: $CANONICAL_KEY" -H "Authorization: Bearer $CANONICAL_KEY" -H "Accept-Profile: app" "http://127.0.0.1:55431/rest/v1/organizations?select=id,code")
          org_count=$(echo "$orgs_json" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); if(d.length!==1||d[0].code!=='multigraph-group'){process.exit(1)}else{console.log(d.length)}")
          if [ "$org_count" -ne 1 ]; then
            echo "::error::Target database verification failed: expected strictly 1 'multigraph-group' organization, got: $orgs_json"
            exit 1
          fi

          for table in orders invoices inventory_reservations order_audit; do
            rows=$(curl --silent --fail -H "apikey: $CANONICAL_KEY" -H "Authorization: Bearer $CANONICAL_KEY" -H "Accept-Profile: app" "http://127.0.0.1:55431/rest/v1/$table?select=id")
            count=$(echo "$rows" | node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).length)")
            if [ "$count" -ne 0 ]; then
              echo "::error::Target database is not clean: table $table contains $count rows"
              exit 1
            fi
          done

          CURRENT_HEAD_SHA=$(git rev-parse HEAD) node -e '
          const fs = require("fs");
          fs.writeFileSync(".qa-evidence/r4-live-assurance/provenance.json", JSON.stringify({
            runnerEnvironment: process.env.RUNNER_ENVIRONMENT || "unknown",
            runnerOs: process.env.RUNNER_OS || "unknown",
            repository: process.env.GITHUB_REPOSITORY || "unknown",
            ref: process.env.GITHUB_REF || "unknown",
            headSha: process.env.CURRENT_HEAD_SHA || process.env.GITHUB_SHA || "unknown",
            pr70BaseSha: "dfc752b528a5dc580cfe9cf97b9170790f27618d",
            canonicalOrigin: "http://127.0.0.1:55431",
            disposableTargetConfirmed: true,
            baselineOrganizations: 1,
            preexistingOrders: 0,
            preexistingInvoices: 0,
            preexistingReservations: 0,
            preexistingAudit: 0,
            verifiedAt: new Date().toISOString()
          }, null, 2));
          '
          echo "Provenance and clean disposable database confirmed."

      - name: Prove missing disposable confirmation fails closed before mutation (R4 QA)
        if: github.ref == 'refs/heads/qa/mgbos-sec02-r4-live-assurance' || github.base_ref == 'security/mgbos-sec02-order-replay-isolation'
        env:
          MGBOS_DESTRUCTIVE_LOCAL_E2E: "1"
        shell: bash
        run: |
          set -euo pipefail
          neg_status=0
          pnpm exec vitest run scripts/order-replay-org-isolation.test.ts > /tmp/raw-negative-control.log 2>&1 || neg_status=$?

          if [ "$neg_status" -eq 0 ]; then
            echo "::error::Intentional negative control without disposable confirmation unexpectedly succeeded!"
            exit 1
          fi

          if ! grep -q "missing or invalid MGBOS_DISPOSABLE_INSTANCE_CONFIRMED acknowledgement" /tmp/raw-negative-control.log; then
            echo "::error::Negative control failed for unexpected reason"
            cat /tmp/raw-negative-control.log
            exit 1
          fi

          sed -E 's/(eyJ[a-zA-Z0-9_\-]{10,}\.[a-zA-Z0-9_\-]{10,}\.[a-zA-Z0-9_\-]{10,})/[REDACTED_JWT]/g' /tmp/raw-negative-control.log > .qa-evidence/r4-live-assurance/negative-control.log
          echo "Negative control verified: execution rejected before database mutation when disposable confirmation is missing."

      - name: Execute live C-SEC-02 PostgREST security assurance suite (R4 QA)
        if: github.ref == 'refs/heads/qa/mgbos-sec02-r4-live-assurance' || github.base_ref == 'security/mgbos-sec02-order-replay-isolation'
        env:
          MGBOS_DESTRUCTIVE_LOCAL_E2E: "1"
          MGBOS_DISPOSABLE_INSTANCE_CONFIRMED: "1"
        shell: bash
        run: |
          set -euo pipefail
          pos_status=0
          pnpm exec vitest run scripts/order-replay-org-isolation.test.ts --reporter=verbose > /tmp/raw-live-test.log 2>&1 || pos_status=$?

          sed -E 's/(eyJ[a-zA-Z0-9_\-]{10,}\.[a-zA-Z0-9_\-]{10,}\.[a-zA-Z0-9_\-]{10,})/[REDACTED_JWT]/g' /tmp/raw-live-test.log > .qa-evidence/r4-live-assurance/positive-test-output.log

          if [ "$pos_status" -ne 0 ]; then
            echo "::error::Live C-SEC-02 security suite failed with status $pos_status"
            cat /tmp/raw-live-test.log
            node -e "
              const fs = require('fs');
              const text = fs.readFileSync('/tmp/raw-live-test.log', 'utf8');
              const marker = 'Failed Tests';
              const idx = text.indexOf(marker);
              const part = idx !== -1 ? text.slice(idx) : text.slice(-3500);
              const escaped = part.slice(0, 3500).replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
              console.log('::error title=Vitest Failure::' + escaped);
            "
            exit 1
          fi

          node -e '
            const fs = require("fs");
            function stripAnsi(str) { return str.replace(/\u001b\[[0-9;]*[a-zA-Z]/g, "").replace(/\x1B\[[0-9;]*[a-zA-Z]/g, ""); }
            function parseVitestSummary(logText) {
              const clean = stripAnsi(logText);
              const testLines = clean.split(/\r?\n/).filter(l => /^\s*Tests\s+/.test(l));
              if (testLines.length !== 1) throw new Error("Expected exactly 1 Tests summary line, found " + testLines.length);
              const summaryLine = testLines[0].trim();
              const passedMatch = summaryLine.match(/(\d+)\s+passed/);
              const failedMatch = summaryLine.match(/(\d+)\s+failed/);
              const skippedMatch = summaryLine.match(/(\d+)\s+skipped/);
              const passedCount = passedMatch ? parseInt(passedMatch[1], 10) : 0;
              const failedCount = failedMatch ? parseInt(failedMatch[1], 10) : 0;
              const skippedCount = skippedMatch ? parseInt(skippedMatch[1], 10) : 0;
              return { passedCount, failedCount, skippedCount, total: passedCount + failedCount + skippedCount, summaryLine };
            }
            const logContent = fs.readFileSync("/tmp/raw-live-test.log", "utf8");
            const parsed = parseVitestSummary(logContent);
            if (parsed.failedCount > 0) {
              console.error("::error::Live suite reported " + parsed.failedCount + " failures: " + parsed.summaryLine);
              process.exit(1);
            }
            if (parsed.skippedCount > 0) {
              console.error("::error::Live suite reported " + parsed.skippedCount + " skipped tests; all 33 live tests must execute: " + parsed.summaryLine);
              process.exit(1);
            }
            if (parsed.passedCount !== 33) {
              console.error("::error::Expected 33 passed live tests, got " + parsed.passedCount + ": " + parsed.summaryLine);
              process.exit(1);
            }
            console.log("Live test suite verified: " + parsed.summaryLine);
          '

      - name: Verify post-test fixture cleanup and absence (R4 QA)
        if: always() && (github.ref == 'refs/heads/qa/mgbos-sec02-r4-live-assurance' || github.base_ref == 'security/mgbos-sec02-order-replay-isolation')
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"

          # 1. Verify transient foreign organizations were cleaned up (strictly 1 organization remains: multigraph-group)
          orgs_json=$(curl --silent --fail -H "apikey: $CANONICAL_KEY" -H "Authorization: Bearer $CANONICAL_KEY" -H "Accept-Profile: app" "http://127.0.0.1:55431/rest/v1/organizations?select=id,code")
          post_org_count=$(echo "$orgs_json" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); if(d.length!==1||d[0].code!=='multigraph-group'){process.exit(1)}else{console.log(d.length)}")
          if [ "$post_org_count" -ne 1 ]; then
            echo "::error::Post-test cleanup verification failed: foreign organizations remain in database: $orgs_json"
            exit 1
          fi

          main_org_id=$(echo "$orgs_json" | node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8'))[0].id)")

          # 2. Verify zero transactional records (orders, invoices, inventory_mutations) exist for any foreign organization
          for table in orders invoices inventory_mutations; do
            foreign_records=$(curl --silent --fail -H "apikey: $CANONICAL_KEY" -H "Authorization: Bearer $CANONICAL_KEY" -H "Accept-Profile: app" "http://127.0.0.1:55431/rest/v1/$table?organization_id=neq.$main_org_id&select=id")
            count=$(echo "$foreign_records" | node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).length)")
            if [ "$count" -ne 0 ]; then
              echo "::error::Post-test cleanup verification failed: table $table contains $count foreign records: $foreign_records"
              exit 1
            fi
          done

          node -e '
          const fs = require("fs");

          function stripAnsi(str) {
            return str.replace(/\u001b\[[0-9;]*[a-zA-Z]/g, "").replace(/\x1B\[[0-9;]*[a-zA-Z]/g, "");
          }

          function parseVitestSummary(logText) {
            const clean = stripAnsi(logText);
            const lines = clean.split(/\r?\n/);
            const testLines = lines.filter(l => /^\s*Tests\s+/.test(l));
            if (testLines.length === 0) throw new Error("No valid Tests summary line found in output");
            if (testLines.length > 1) throw new Error("Ambiguous Tests summary: found " + testLines.length + " matching lines");
            const summaryLine = testLines[0].trim();
            const passedMatch = summaryLine.match(/(\d+)\s+passed/);
            const failedMatch = summaryLine.match(/(\d+)\s+failed/);
            const skippedMatch = summaryLine.match(/(\d+)\s+skipped/);
            const passedCount = passedMatch ? parseInt(passedMatch[1], 10) : 0;
            const failedCount = failedMatch ? parseInt(failedMatch[1], 10) : 0;
            const skippedCount = skippedMatch ? parseInt(skippedMatch[1], 10) : 0;
            const totalTestsExecuted = passedCount + failedCount + skippedCount;
            if (totalTestsExecuted === 0) throw new Error("Parsed zero total tests");
            return { passedCount, failedCount, skippedCount, totalTestsExecuted, summaryLine };
          }

          // 1. Required parser negative controls (QA-F01)
          const r1 = parseVitestSummary(" Test Files  1 passed (1)\n      Tests  33 passed (33)");
          if (r1.passedCount !== 33 || r1.failedCount !== 0 || r1.skippedCount !== 0) {
            throw new Error("Parser Control 1 failed: did not extract 33 passed");
          }
          const r2 = parseVitestSummary(" Test Files  1 failed (1)\n      Tests  32 passed | 1 failed (33)");
          if (r2.passedCount !== 32 || r2.failedCount !== 1) {
            throw new Error("Parser Control 2 failed: did not detect failure");
          }
          const r3 = parseVitestSummary("      Tests  28 passed | 5 skipped (33)");
          if (r3.passedCount !== 28 || r3.skippedCount !== 5) {
            throw new Error("Parser Control 3 failed: did not detect skipped");
          }
          let threwMissing = false;
          try { parseVitestSummary("No summary line here\nDone in 5s"); } catch { threwMissing = true; }
          if (!threwMissing) throw new Error("Parser Control 4 failed: missing summary did not fail closed");
          let threwAmbiguous = false;
          try { parseVitestSummary(" Tests  10 passed (10)\n Tests  20 passed (20)"); } catch { threwAmbiguous = true; }
          if (!threwAmbiguous) throw new Error("Parser Control 5 failed: ambiguous summary did not fail closed");

          // 2. Parse live test log
          const logText = fs.existsSync("/tmp/raw-live-test.log") ? fs.readFileSync("/tmp/raw-live-test.log", "utf8") : "";
          if (!logText) throw new Error("Raw live test log is empty or missing");
          const parsed = parseVitestSummary(logText);

          // 3. Write summary.json with verified dynamic parsed values
          fs.writeFileSync(".qa-evidence/r4-live-assurance/summary.json", JSON.stringify({
            testSuite: "scripts/order-replay-org-isolation.test.ts",
            totalTestsExecuted: parsed.totalTestsExecuted,
            passedCount: parsed.passedCount,
            failedCount: parsed.failedCount,
            skippedCount: parsed.skippedCount,
            negativeControlVerified: true,
            fixtureCleanupVerified: true,
            postRunAbsenceVerified: true,
            advisoryLockContentionStatus: "NOT_VERIFIED",
            serverTransactionOverlapStatus: "NOT_VERIFIED",
            transportInterruptionStatus: "SIMULATED_DISCARDED_HTTP_RESPONSE",
            uniqueViolationCausalStatus: "NOT_VERIFIED",
            completedAt: new Date().toISOString()
          }, null, 2));
          '
          echo "Post-test fixture cleanup and absence verified."

      - name: Upload sanitized R4 live security assurance evidence
        if: always() && (github.ref == 'refs/heads/qa/mgbos-sec02-r4-live-assurance' || github.base_ref == 'security/mgbos-sec02-order-replay-isolation')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mgbos-r4-live-security-assurance
          path: systems/mgbos/.qa-evidence/r4-live-assurance/

      - name: Dispose isolated database and verify unreachable (R4 QA)
        if: always() && (github.ref == 'refs/heads/qa/mgbos-sec02-r4-live-assurance' || github.base_ref == 'security/mgbos-sec02-order-replay-isolation')
        shell: bash
        run: |
          pnpm db:stop > /dev/null 2>&1 || true
          if curl --silent --fail --connect-timeout 2 "http://127.0.0.1:55431/rest/v1/" > /dev/null 2>&1; then
            echo "::error::Database disposal failed: database is still reachable on canonical port 55431"
            exit 1
          fi
          echo "Database disposal verified: canonical port 55431 is unreachable."

      - if: always()
        run: pnpm db:stop > /dev/null 2>&1

  browser-authentication:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: systems/mgbos/.node-version
          cache: pnpm
          cache-dependency-path: systems/mgbos/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run browser authentication harness regression tests
        run: node --test scripts/browser-auth-hygiene-qa.test.mjs
      - name: Prepare disposable local Supabase
        shell: bash
        run: |
          set -euo pipefail
          # Supabase CLI prints local privileged keys and storage credentials.
          # Never write its raw output to public CI logs or uploaded artifacts.
          if ! pnpm db:start > /dev/null 2>&1; then
            echo "::error::Local Supabase startup failed (sensitive output suppressed)"
            exit 1
          fi
          if ! pnpm db:reset > /dev/null 2>&1; then
            echo "::error::Local Supabase reset failed (sensitive output suppressed)"
            exit 1
          fi
      - name: Run real browser authentication verification
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .qa-evidence/browser-auth/positive
          pos_status=0
          pnpm qa:browser-auth || pos_status=$?
          node scripts/browser-auth-hygiene-qa.mjs \
            --verify-trace .qa-evidence/browser-auth/positive/trace.json \
            --expected-mode normal \
            --exit-status "$pos_status"
      - name: Prove broken form login fails the browser gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .qa-evidence/browser-auth/negative-control
          neg_status=0
          MGBOS_QA_NEGATIVE_CONTROL=1 pnpm qa:browser-auth > /dev/null 2>&1 || neg_status=$?
          if [ "$neg_status" -eq 0 ]; then
            echo "::error::Intentional broken-login control incorrectly returned success"
            exit 1
          fi
          node scripts/browser-auth-hygiene-qa.mjs \
            --verify-trace .qa-evidence/browser-auth/negative-control/trace.json \
            --expected-mode intentional-broken-login \
            --exit-status "$neg_status"
      - name: Upload sanitized browser verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mgbos-browser-auth-qa
          path: systems/mgbos/.qa-evidence/browser-auth/
      - name: Stop local Supabase
        if: always()
        shell: bash
        run: |
          if ! pnpm db:stop > /dev/null 2>&1; then
            echo "::error::Disposable Supabase teardown failed (sensitive output suppressed)"
            exit 1
          fi

  browser-ui-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: systems/mgbos/.node-version
          cache: pnpm
          cache-dependency-path: systems/mgbos/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run browser UI harness regression tests
        run: node --test scripts/browser-ui-multirole-qa.test.mjs
      - name: Prepare disposable local Supabase
        shell: bash
        run: |
          set -euo pipefail
          # Supabase CLI prints local privileged keys and storage credentials.
          # Never write its raw output to public CI logs or uploaded artifacts.
          if ! pnpm db:start > /dev/null 2>&1; then
            echo "::error::Local Supabase startup failed (sensitive output suppressed)"
            exit 1
          fi
          if ! pnpm db:reset > /dev/null 2>&1; then
            echo "::error::Local Supabase reset failed (sensitive output suppressed)"
            exit 1
          fi
      - name: Run real browser UI acceptance verification
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .qa-evidence/browser-ui/positive
          pos_status=0
          pnpm qa:browser-ui || pos_status=$?
          node scripts/browser-ui-multirole-qa.mjs \
            --verify-trace .qa-evidence/browser-ui/positive/trace.json \
            --expected-mode normal \
            --exit-status "$pos_status"
      - name: Prove broken shortcut assertion fails the browser UI gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .qa-evidence/browser-ui/negative-control
          neg_status=0
          MGBOS_QA_NEGATIVE_CONTROL=1 pnpm qa:browser-ui > /dev/null 2>&1 || neg_status=$?
          if [ "$neg_status" -eq 0 ]; then
            echo "::error::Intentional negative control incorrectly returned success"
            exit 1
          fi
          node scripts/browser-ui-multirole-qa.mjs \
            --verify-trace .qa-evidence/browser-ui/negative-control/trace.json \
            --expected-mode intentional-broken-control \
            --exit-status "$neg_status"
      - name: Upload sanitized browser UI verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mgbos-browser-ui-qa
          path: systems/mgbos/.qa-evidence/browser-ui/
      - name: Stop local Supabase
        if: always()
        shell: bash
        run: |
          if ! pnpm db:stop > /dev/null 2>&1; then
            echo "::error::Disposable Supabase teardown failed (sensitive output suppressed)"
            exit 1
          fi

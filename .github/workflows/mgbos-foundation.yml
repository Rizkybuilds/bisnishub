name: MGBOS Foundation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mgbos-foundation-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: systems/mgbos
env:
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: systems/mgbos/.node-version
          cache: pnpm
          cache-dependency-path: systems/mgbos/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Production HTTP smoke tests
        shell: bash
        run: |
          pnpm --filter @mgbos/app start > /tmp/mgbos.log 2>&1 &
          mgbos_pid=$!
          pnpm --filter @mgbos/teestock start > /tmp/teestock.log 2>&1 &
          teestock_pid=$!
          trap 'kill "$mgbos_pid" "$teestock_pid" 2>/dev/null || true' EXIT
          for port in 3101 3102; do
            ready=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent "http://127.0.0.1:$port/health" > /dev/null; then
                ready=true
                break
              fi
              sleep 1
            done
            if [ "$ready" != true ]; then
              cat /tmp/mgbos.log /tmp/teestock.log
              exit 1
            fi
          done
          pnpm test:integration
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: systems/mgbos/.node-version
          cache: pnpm
          cache-dependency-path: systems/mgbos/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node scripts/lint-migrations.mjs
      - run: pnpm db:start
      - run: pnpm db:reset
      - run: pnpm db:test
      - name: Generate database types reproducibly
        run: |
          pnpm db:types
          cp packages/database/generated/database.types.ts /tmp/database.types.ts
          pnpm db:types
          cmp /tmp/database.types.ts packages/database/generated/database.types.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mgbos-database-types
          path: systems/mgbos/packages/database/generated/database.types.ts
      - if: always()
        run: pnpm db:stop

name: PR Gate

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  pr-gate:
    name: pr-gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify PR Title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Regex for conventional commits (e.g., feat(mgbos):, fix:, docs(scope):, etc.)
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?:\ .*$ ]]; then
            echo "Error: PR title '$PR_TITLE' does not follow Conventional Commits format."
            echo "Example: feat(mgbos): add new login page"
            exit 1
          fi
          echo "PR title is valid."

      - name: Verify PR Body is not empty
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Check if body is empty or only contains whitespace
          if [[ -z "${PR_BODY//[[:space:]]/}" ]]; then
            echo "Error: PR body cannot be empty. Please provide a description of the changes."
            exit 1
          fi
          echo "PR body is not empty."

      - name: Verify Scope Isolation
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only -z "$PR_BASE_SHA...$PR_HEAD_SHA" > "$RUNNER_TEMP/pr-changed-files"
          
          MGBOS_FILES=0
          NON_MGBOS_FILES=0
          
          while IFS= read -r -d '' file; do
            if [[ "$file" == mgbos/* ]] || [[ "$file" == .github/workflows/mgbos-* ]]; then
              MGBOS_FILES=1
            else
              NON_MGBOS_FILES=1
            fi
          done < "$RUNNER_TEMP/pr-changed-files"
          
          if [[ $MGBOS_FILES -eq 1 && $NON_MGBOS_FILES -eq 1 ]]; then
            echo "Error: Scope isolation violation."
            echo "Your PR modifies files inside 'mgbos/' (or its CI workflows) AND unrelated files simultaneously."
            echo "Please separate your changes into different Pull Requests."
            exit 1
          fi
          
          echo "Scope isolation check passed."


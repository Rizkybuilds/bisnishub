name: PR Gate

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  pr-gate:
    name: pr-gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify PR Title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Regex for conventional commits (e.g., feat(mgbos):, fix:, docs(scope):, etc.)
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?:\ .*$ ]]; then
            echo "Error: PR title '$PR_TITLE' does not follow Conventional Commits format."
            echo "Example: feat(mgbos): add new login page"
            exit 1
          fi
          echo "PR title is valid."

      - name: Verify PR Body is not empty
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Check if body is empty or only contains whitespace
          if [[ -z "${PR_BODY//[[:space:]]/}" ]]; then
            echo "Error: PR body cannot be empty. Please provide a description of the changes."
            exit 1
          fi
          echo "PR body is not empty."

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: node --test scripts/governance/pr-scope.test.mjs
      - name: Verify Scope Isolation
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/governance/check-pr-scope.mjs "$PR_BASE_SHA" "$PR_HEAD_SHA"

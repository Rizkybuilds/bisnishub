name: TeeStock F01 Formatter Export (temporary)
on:
  push:
    branches: [feat/teestock-product-catalog-f01]
permissions:
  contents: read
jobs:
  format-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: systems/mgbos
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: systems/mgbos/.node-version
      - run: pnpm install --frozen-lockfile
      - name: Format new files and export only their source
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const files = [
            'apps/mgbos/src/app/(app)/catalog/actions.ts',
            'apps/mgbos/src/app/(app)/catalog/catalog.css',
            'apps/mgbos/src/app/(app)/catalog/CatalogManager.tsx',
            'apps/mgbos/src/app/(app)/catalog/data.ts',
            'apps/mgbos/src/app/(app)/catalog/page.tsx',
            'apps/teestock/src/app/catalog.css',
            'apps/teestock/src/app/shop/page.tsx',
            'apps/teestock/src/app/shop/products/[slug]/page.tsx',
            'apps/teestock/src/components/PublishedCatalog.tsx',
            'apps/teestock/src/lib/published-catalog.server.ts',
            'packages/validation/src/catalog.test.ts',
            'packages/validation/src/catalog.ts',
          ];
          execFileSync('pnpm', ['exec', 'prettier', '--write', ...files], { stdio: 'inherit' });
          for (const file of files) {
            process.stdout.write('CATALOG_FORMAT:' + file + ':' + fs.readFileSync(file).toString('base64') + '\n');
          }
          NODE

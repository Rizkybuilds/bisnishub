name: MGBOS UXR02-A Browser Acceptance
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: mgbos-uxr02-a-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  uxr02-a-browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify execution repository and companion context
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.repository }}" != "Rizkybuilds/bisnishub" ]; then
            echo "::error::Untrusted repository context: ${{ github.repository }}"
            exit 1
          fi
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "Rizkybuilds/bisnishub" ]; then
            echo "::error::Fork workflow execution rejected"
            exit 1
          fi
          if [ "${{ github.event.pull_request.number }}" != "72" ]; then
            echo "::error::Untrusted PR context: expected PR #72, got PR #${{ github.event.pull_request.number }}"
            exit 1
          fi
          if [ "${{ github.event.pull_request.base.ref }}" != "main" ]; then
            echo "::error::Untrusted base branch: expected main, got ${{ github.event.pull_request.base.ref }}"
            exit 1
          fi
          if [ "${{ github.event.pull_request.head.ref }}" != "qa/mgbos-uxr02-a-acceptance" ]; then
            echo "::error::Untrusted head branch: expected qa/mgbos-uxr02-a-acceptance, got ${{ github.event.pull_request.head.ref }}"
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and checkout exact PR #72 harness HEAD
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HARNESS_HEAD="${{ github.event.pull_request.head.sha }}"
          git checkout "$EXPECTED_HARNESS_HEAD"
          ACTUAL_HARNESS_HEAD="$(git rev-parse HEAD)"
          if [ "$ACTUAL_HARNESS_HEAD" != "$EXPECTED_HARNESS_HEAD" ]; then
            echo "::error::Harness checkout SHA mismatch: expected $EXPECTED_HARNESS_HEAD, got $ACTUAL_HARNESS_HEAD"
            exit 1
          fi
          ACTUAL_HARNESS_TREE="$(git rev-parse HEAD^{tree})"
          echo "Verified harness checkout at commit $ACTUAL_HARNESS_HEAD (tree $ACTUAL_HARNESS_TREE)"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: systems/mgbos/.node-version
          cache: pnpm
          cache-dependency-path: systems/mgbos/pnpm-lock.yaml
      - name: Install dependencies in companion workspace
        shell: bash
        run: |
          set -euo pipefail
          cd systems/mgbos
          pnpm install --frozen-lockfile
      - name: Run browser QA harness unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd systems/mgbos
          node --test scripts/uxr02-a-browser-acceptance.test.mjs
      - name: Prepare disposable local Supabase on ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          cd systems/mgbos
          # Confirm ephemeral runner environment
          if [ "${CI:-}" != "true" ] || [ "${GITHUB_ACTIONS:-}" != "true" ]; then
            echo "::error::Must execute on authorized GitHub Actions runner"
            exit 1
          fi
          # Verify loopback endpoints before start
          if ! pnpm db:start > /dev/null 2>&1; then
            echo "::error::Disposable Supabase startup failed (sensitive output suppressed)"
            exit 1
          fi
          if ! pnpm db:reset > /dev/null 2>&1; then
            echo "::error::Disposable Supabase reset failed (sensitive output suppressed)"
            exit 1
          fi
      - name: Checkout and verify PR #68 candidate application
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PR68_SHA="13c5866a92d3b778e298af9689cdf6952e89ad72"
          APP_DIR="/tmp/pr68-candidate-app"
          rm -rf "$APP_DIR"
          git fetch origin feat/mgbos-uxr02-a-data-states
          REMOTE_PR68_SHA="$(git rev-parse origin/feat/mgbos-uxr02-a-data-states)"
          if [ "$REMOTE_PR68_SHA" != "$EXPECTED_PR68_SHA" ]; then
            echo "::error::Candidate branch head drift: expected $EXPECTED_PR68_SHA, got $REMOTE_PR68_SHA"
            exit 1
          fi
          git worktree add "$APP_DIR" "$EXPECTED_PR68_SHA"
          ACTUAL_APP_SHA="$(git -C "$APP_DIR" rev-parse HEAD)"
          ACTUAL_APP_TREE_SHA="$(git -C "$APP_DIR" rev-parse HEAD^{tree})"
          if [ "$ACTUAL_APP_SHA" != "$EXPECTED_PR68_SHA" ]; then
            echo "::error::Candidate SHA drift: expected $EXPECTED_PR68_SHA, got $ACTUAL_APP_SHA"
            exit 1
          fi
          echo "Verified candidate PR #68 checkout at commit $ACTUAL_APP_SHA (tree $ACTUAL_APP_TREE_SHA)"
          cd "$APP_DIR/systems/mgbos"
          pnpm install --frozen-lockfile
          eval $(node --input-type=module -e '
            import { localStatus } from "'"$GITHUB_WORKSPACE"'/systems/mgbos/scripts/browser-auth-hygiene-qa.mjs";
            const s = localStatus();
            process.stdout.write(`export NEXT_PUBLIC_SUPABASE_URL="http://127.0.0.1:55430"\n`);
            process.stdout.write(`export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${s.ANON_KEY}"\n`);
            process.stdout.write(`export SUPABASE_SERVICE_ROLE_KEY="${s.SERVICE_ROLE_KEY}"\n`);
          ')
          export NEXT_TELEMETRY_DISABLED=1
          export PORT=3101
          pnpm --filter @mgbos/app build
      - name: Start PR #68 application and run real browser CRM acceptance
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="/tmp/pr68-candidate-app"
          cd "$APP_DIR/systems/mgbos"
          eval $(node --input-type=module -e '
            import { localStatus } from "'"$GITHUB_WORKSPACE"'/systems/mgbos/scripts/browser-auth-hygiene-qa.mjs";
            const s = localStatus();
            process.stdout.write(`export NEXT_PUBLIC_SUPABASE_URL="http://127.0.0.1:55430"\n`);
            process.stdout.write(`export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${s.ANON_KEY}"\n`);
            process.stdout.write(`export SUPABASE_SERVICE_ROLE_KEY="${s.SERVICE_ROLE_KEY}"\n`);
          ')
          export NEXT_TELEMETRY_DISABLED=1
          export PORT=3101
          pnpm --filter @mgbos/app start > /tmp/mgbos-app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:3101/health" > /dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error::Next.js candidate application failed to start"
            cat /tmp/mgbos-app.log
            exit 1
          fi
          cd - > /dev/null
          rm -rf systems/mgbos/.qa-evidence/uxr02-a/positive
          pos_status=0
          export GITHUB_RUN_ID="${{ github.run_id }}"
          export GITHUB_RUN_ATTEMPT="${{ github.run_attempt }}"
          export GITHUB_REPOSITORY="${{ github.repository }}"
          export PR_NUMBER="${{ github.event.pull_request.number }}"
          export PR_HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          NEXT_PUBLIC_SUPABASE_URL="http://127.0.0.1:55431" node systems/mgbos/scripts/uxr02-a-browser-acceptance.mjs \
            --app-dir "$APP_DIR" \
            --proxy-port 55430 \
            --expected-checkout-sha "13c5866a92d3b778e298af9689cdf6952e89ad72" \
            --expected-harness-sha "${{ github.event.pull_request.head.sha }}" || pos_status=$?
          node systems/mgbos/scripts/uxr02-a-browser-acceptance.mjs \
            --verify-trace systems/mgbos/.qa-evidence/uxr02-a/positive/trace.json \
            --expected-mode normal \
            --expected-checkout-sha "13c5866a92d3b778e298af9689cdf6952e89ad72" \
            --expected-harness-sha "${{ github.event.pull_request.head.sha }}" \
            --exit-status "$pos_status"
      - name: Prove broken assertion fails the UXR02-A gate (negative control)
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="/tmp/pr68-candidate-app"
          rm -rf systems/mgbos/.qa-evidence/uxr02-a/negative-control
          neg_status=0
          export GITHUB_RUN_ID="${{ github.run_id }}"
          export GITHUB_RUN_ATTEMPT="${{ github.run_attempt }}"
          export GITHUB_REPOSITORY="${{ github.repository }}"
          export PR_NUMBER="${{ github.event.pull_request.number }}"
          export PR_HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          NEXT_PUBLIC_SUPABASE_URL="http://127.0.0.1:55431" MGBOS_QA_NEGATIVE_CONTROL=1 node systems/mgbos/scripts/uxr02-a-browser-acceptance.mjs \
            --app-dir "$APP_DIR" \
            --proxy-port 55430 \
            --expected-checkout-sha "13c5866a92d3b778e298af9689cdf6952e89ad72" \
            --expected-harness-sha "${{ github.event.pull_request.head.sha }}" > /dev/null 2>&1 || neg_status=$?
          if [ "$neg_status" -eq 0 ]; then
            echo "::error::Intentional negative control incorrectly returned success"
            exit 1
          fi
          node systems/mgbos/scripts/uxr02-a-browser-acceptance.mjs \
            --verify-trace systems/mgbos/.qa-evidence/uxr02-a/negative-control/trace.json \
            --expected-mode intentional-broken-control \
            --expected-checkout-sha "13c5866a92d3b778e298af9689cdf6952e89ad72" \
            --expected-harness-sha "${{ github.event.pull_request.head.sha }}" \
            --exit-status "$neg_status"
      - name: Upload sanitized UXR02-A browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mgbos-uxr02-a-acceptance-evidence
          path: systems/mgbos/.qa-evidence/uxr02-a/
      - name: Teardown disposable Supabase and runner resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd systems/mgbos
          teardown_failed=0
          pnpm db:stop || teardown_failed=1
          git worktree remove /tmp/pr68-candidate-app --force 2>/dev/null || true
          rm -rf /tmp/pr68-candidate-app /tmp/mgbos-app.log
          if [ "$teardown_failed" -ne 0 ]; then
            echo "::error::Disposable Supabase runner teardown failed"
            exit 1
          fi

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- TeeStock Official Favicon & App Icon Badge -->
  <!-- Signature Terracotta Emblem Background -->
  <rect width="100" height="100" rx="22" fill="#D95D39" />
  
  <!-- Authentic Folded T-Shirt Mark ('The Stock') -->
  <g transform="translate(5, 5) scale(0.9)">
    <!-- Crewneck Collar: Double Rib Arc -->
    <path d="M 38 16 C 42 18.8, 46 19.8, 50 19.8 C 54 19.8, 58 18.8, 62 16" stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 39 19.5 C 42.5 27, 46 29, 50 29 C 54 29, 57.5 27, 61 19.5" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 35 23 C 38.5 32, 44 34, 50 34 C 56 34, 61.5 32, 65 23" stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Shoulders -->
    <path d="M 38 16 L 22 21" stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 62 16 L 78 21" stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Left Sleeve & Armpit Inseam -->
    <path d="M 22 21 L 13.5 43.5 L 24 48" stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 26.5 31.5 L 26.5 47.5" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Sleeve & Armpit Inseam -->
    <path d="M 78 21 L 86.5 43.5 L 76 48" stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 73.5 31.5 L 73.5 47.5" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Torso & Fold 1 (Top Fold) -->
    <path d="M 26.5 47.5 C 26.5 53, 23 57, 19.5 60.5 C 17 63, 17 66.5, 20.5 68 L 79.5 68 C 83 66.5, 83 63, 80.5 60.5 C 77 57, 73.5 53, 73.5 47.5" stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 35 60 C 42 59.2, 58 59.2, 65 60" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Fold 2 (Middle Pill Fold) -->
    <path d="M 20.5 68 C 17 69.8, 17 74.2, 20.5 76 L 79.5 76 C 83 74.2, 83 69.8, 79.5 68" stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Fold 3 (Base Pill Fold) -->
    <path d="M 20.5 76 C 17 78, 17 83, 21.5 84.5 C 26 85.8, 40 85, 50 85 C 60 85, 74 85.8, 78.5 84.5 C 83 83, 83 78, 79.5 76" stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
